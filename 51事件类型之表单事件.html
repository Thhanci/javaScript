<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="username" placeholder="?">
    <input type="text" id="password">
    <script>
        var username=document.getElementById("username")
        username.oninput=function(e){
            // console.log(e.target.value)//读取数据
        }
        username.onselect=function(e){
            console.log("选中了")
            console.log(e.target.value)
            console.log(e.target.value.substring(e.target.selectionStart,e.target.selectionEnd))

            var input=e.target
            var start=input.selectionStart
            var end=input.selectionEnd
            var selectedText=input.value.substring(start,end)

            console.log("选中的内容： ",selectedText)
        }

        //失去焦点和回车的时候触发
        var password=document.getElementById("password")
        password.onchange=function(e){
            console.log(e.target.value)
        }
    </script>
</body>
</html>
