    <script>

        // function print(){

        //     console.log("Hello");

        // print();//Hello 定时器








        function timeout(ms){
            //resolve:是一个函数
            return new Promise((resolve,reject)=>{
                setTimeout(function(){
                    console.log("Timeout");
                    resolve();
                },ms)
            })
        }
        // function timeout(ms){
        //         setTimeout(function(){
        //             console.log("Timeout");
        //         },ms)
        // }//await 必须配合 Promise 才能实现延迟等待！


        async function asyncPrint(ms,value) {
            //在具有异步操作的代码前面放入:await
            await timeout(ms);
            console.log(value);
        }

        asyncPrint(100,"hello")

    </script>
