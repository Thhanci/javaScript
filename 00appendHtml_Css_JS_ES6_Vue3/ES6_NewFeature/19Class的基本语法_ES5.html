<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        //ES5类的表现形式
        function Person(name,age){
            this.name=name;
            this.age=age;
        }
        Person.prototype.getName = function(){
            console.log(this.name);
        }//prototype 是 JavaScript 中每个函数都自带的一个对象，用来存放所有实例共享的属性和方法
        //Person里，name age不一样 ，getName()一样，放prototype里 
        // prototype（所有实例共享方法）
        var p=new Person("iwen",20);
        p.getName();


    </script>

</body>
</html>
