<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn">按钮</button>

    <a href="https://itbaizhan.com" id="baizhan">itbaizhan</a>
    <script>
        var btn=document.getElementById("btn")
        //Event事件对象 其实就是参数
        btn.onclick = function(event){
            event.target.innerHTML="点击之后"
            console.log(event.type)//click
        }
        btn.onmousemove = function(event){
            // event.target.innerHTML="点击之后"
            console.log(event.type)//click
        }

        var baizhan=document.getElementById("baizhan")
        baizhan.onclick=function(event){
            // event.preventDefault()
            console.log("点击了baizhan")
        }
    </script>
</body>
</html>


<!-- 
鼠标事件：
click         单击
dblclick      双击
mousedown     鼠标按下
mouseup       鼠标松开
mousemove     鼠标移动
mouseover     鼠标移入（含子元素，冒泡）
mouseout      鼠标移出（含子元素，冒泡）
mouseenter    鼠标进入（不含子元素，不冒泡）
mouseleave    鼠标离开（不含子元素，不冒泡）
contextmenu   右键菜单

键盘事件：
keydown       按键按下
keyup         按键松开
keypress      按键按压（已废弃）

表单事件：
focus         获得焦点
blur          失去焦点
change        值改变
input         输入变化
submit        表单提交
reset         表单重置
select        文本选中

窗口/文档事件：
load          加载完成
unload        卸载
scroll        滚动
resize        窗口大小变化
DOMContentLoaded  DOM加载完成
beforeunload  页面关闭前

拖拽事件：
drag          拖拽
dragstart     开始拖拽
dragend       拖拽结束
dragover      拖拽悬停
drop          放置
dragenter     进入目标
dragleave     离开目标

触摸事件（移动端）：
touchstart    触摸开始
touchmove     触摸移动
touchend      触摸结束
touchcancel   触摸取消

其他事件：
copy          复制
cut           剪切
paste         粘贴
error         加载错误
abort         加载中止
animationstart 动画开始
animationend   动画结束
transitionend  过渡结束
 -->
